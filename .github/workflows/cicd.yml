# This is a basic workflow to help you get started with Actions.

name: FinNAI CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ prod ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build-and-deploy"
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Login to DockerHub
      # GitHub Repository Secrets에 DOCKERHUB_USERNAME, DOCKERHUB_TOKEN을 설정해야 합니다.
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      # DOCKERHUB_USERNAME을 실제 DockerHub 사용자 이름으로 변경해야 합니다.
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finnai-inference:latest

      # Deploy to remote server
      # GitHub Repository Secrets에 SSH_HOST, SSH_USERNAME, SSH_PRIVATE_KEY, SSH_PORT를 설정해야 합니다.
      # 또한, 원격 서버에서 --env-file 경로를 실제 .env 파일 경로로 수정해야 합니다.
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Pull the latest Docker image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/finnai-inference:latest
            
            # Stop and remove the existing container
            docker stop finnai-inference-container || true
            docker rm finnai-inference-container || true
            
            # Run the new container with the environment file
            # 원격 서버의 .env 파일 경로를 확인하고 수정하세요.
            docker run -d --name finnai-inference-container --env-file /path/to/your/.env -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/finnai-inference:latest
